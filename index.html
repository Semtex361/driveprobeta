<title>DrivePro Beta V90</title>
<style>
:root{
 --primary:#1769d2;--primary2:#2f80ed;--primary-soft:#eaf3ff;
 --bg:#f4f7fc;--surface:#fff;--surface2:#f8fbff;--text:#17243a;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;transition:.18s ease}
button:active{transform:translateY(1px)}
.app{display:flex;min-height:100vh}
.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:5}
.brand{display:flex;gap:12px;align-items:center;padding:6px 10px 28px;font-size:19px;font-weight:800;letter-spacing:-.3px}

.nav{display:flex;flex-direction:column;gap:4px}

.sidefoot{position:absolute;bottom:22px;left:24px;color:#98a49f;font-size:11px;line-height:1.6}
.main{margin-left:250px;flex:1;min-width:0}
.top{height:78px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}

.content{max-width:1380px;margin:auto;padding:30px 34px 50px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:7px}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}
.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.toolbar input{max-width:320px}

input:focus,select:focus,textarea:focus{border-color:#77b9a0;box-shadow:0 0 0 3px rgba(33,132,102,.10)}
button.primary{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;padding:11px 16px;border-radius:11px;box-shadow:0 5px 14px rgba(23,107,82,.18)}

button.secondary{background:var(--primary-soft);color:var(--primary);padding:10px 14px;border-radius:10px}
button.secondary:hover{background:#dcefe7}
button.danger{background:#fff0f0;color:var(--danger);padding:10px 14px;border-radius:10px}
.students{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.student{display:flex;align-items:center;gap:15px;padding:5px 0}
.avatar{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#e6f6ef,#d8eee6);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:none}
.grow{flex:1;min-width:0}
.progress{height:7px;background:#e9efec;border-radius:20px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary2),#4aa57f);border-radius:20px}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line)}
.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.empty{padding:42px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(12,28,22,.48);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}

.dialog{background:#fff;border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:26px;width:min(900px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 80px rgba(0,0,0,.18)}
.dialog h2{margin:0 0 18px;font-size:23px;letter-spacing:-.4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin:10px 0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:7px;color:#56635d}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 -2px 20px;flex-wrap:wrap}
.tabs button{background:transparent;border-radius:9px 9px 0 0;padding:11px 14px;color:var(--muted);font-weight:650}

.area{display:grid;grid-template-columns:minmax(190px,1fr) 150px minmax(180px,1fr);gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.lesson b{display:block;margin-bottom:5px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden}
.day{min-height:130px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px}
.daynum{font-size:12px;color:var(--muted);font-weight:750}
.event{background:var(--primary-soft);color:var(--primary);border-left:3px solid var(--primary2);border-radius:8px;padding:7px 8px;margin-top:7px;font-size:11px;cursor:pointer;line-height:1.35}
.event:hover{background:#d9eee6}
.weeknames{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:#fafcfb}
.weeknames div{text-align:center;padding:10px;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.4px}
.sigwrap{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.sighead{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f8faf9;border-bottom:1px solid var(--line)}
.signature{width:100%;height:180px;display:block;touch-action:none;background:#fff}
.hint{font-size:12px;color:var(--muted)}
.routebox{height:180px;border:1px dashed #b9c9c1;border-radius:14px;display:grid;place-items:center;color:var(--muted);text-align:center;background:linear-gradient(145deg,#f8fbf9,#f2f8f5)}
.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:5px 9px;font-size:12px;margin:2px}
.small{font-size:12px}
.clickable{cursor:pointer}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.section-title h3{margin:0;font-size:17px}

.welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px;padding:4px 2px}.welcome h2{margin:5px 0 4px;font-size:30px;letter-spacing:-1px}.welcome p{margin:0;color:var(--muted);font-size:14px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--primary)}
.bigbtn{padding:13px 18px!important}.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.heroCard{border-radius:20px;padding:20px;display:flex;gap:15px;align-items:center;position:relative;overflow:hidden;min-height:118px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}.heroCard:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-25px;bottom:-40px;background:rgba(255,255,255,.14)}.heroCard.green{background:linear-gradient(135deg,#e9f8f1,#d8f0e5)}.heroCard.blue{background:linear-gradient(135deg,#eef5ff,#e0ebff)}.heroCard.purple{background:linear-gradient(135deg,#f4efff,#eae0ff)}.heroCard.orange{background:linear-gradient(135deg,#fff7e8,#ffedc7)}.heroIcon{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(20,50,40,.06)}.heroLabel{font-size:12px;color:var(--muted);font-weight:650}.heroValue{font-size:28px;font-weight:850;letter-spacing:-1px}.heroHint{font-size:11px;color:var(--muted)}.dashboardGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}.bottomGrid{grid-template-columns:1.25fr .75fr}.livelyCard{box-shadow:0 8px 26px rgba(20,55,42,.055)}.calendarDot{color:var(--primary);font-size:15px}.dashStudent{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px;transition:.15s}.dashStudent:hover{background:#f7faf8;padding-left:9px;padding-right:9px}.bigavatar{width:46px;height:46px;border-radius:14px}.studentHead{display:flex;justify-content:space-between;gap:10px}.studentHead span{font-weight:800;color:var(--primary)}.bigprogress{height:6px;margin-top:8px}.arrow{font-size:22px;color:#a1aaa5}.upcoming{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}.upcoming:hover{background:#f7faf8}.timeBadge{min-width:58px;padding:9px 7px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-weight:800;text-align:center;font-size:12px}.quickAction{width:100%;display:grid;grid-template-columns:40px 1fr 22px;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:#f8faf9;border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:13px;color:var(--text)}.quickAction:hover{background:var(--primary-soft);border-color:#cce6db}.quickAction span{grid-row:1/3;width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px}.quickAction b{font-size:13px}.quickAction small{color:var(--muted);font-size:11px}.quickAction strong{grid-column:3;grid-row:1/3;color:var(--primary);font-size:20px}

.specialGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.specialCard{display:flex;align-items:center;gap:11px;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fbfcfb}.specialIcon{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:19px}.specialCard strong{color:var(--primary);font-size:14px}

.brand{gap:12px;padding:6px 10px 30px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#2f80ed,#1557b0);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(47,128,237,.25)}
.logo svg{width:29px;height:29px}
.brandText{display:flex;flex-direction:column;line-height:1.05;letter-spacing:-.2px}
.brandText strong{font-size:19px;color:#17345f}
.brandText strong span{color:#2f80ed}
.brandText small{font-size:9px;color:#8a98ab;letter-spacing:.5px;text-transform:uppercase;margin-top:5px;font-weight:700}
.side{background:linear-gradient(180deg,#fff 0%,#fbfdff 100%)}
.nav button.active{background:linear-gradient(90deg,#eaf3ff,#f3f8ff);color:#1769d2;box-shadow:inset 3px 0 0 #2f80ed}
.nav button:hover{background:#f3f7fc;color:#1769d2}
.top{background:rgba(255,255,255,.96)}
.top h1{color:#172d4e}.top:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,#2f80ed,#8fc2ff,transparent)}

.progress i{background:linear-gradient(90deg,#2f80ed,#65a6f6)}
.avatar{background:linear-gradient(145deg,#eaf3ff,#dcecff);color:#1769d2}
.timeBadge{background:#eaf3ff;color:#1769d2}

.welcome{padding:10px 4px 24px}.welcome h2{font-size:32px;font-weight:850;color:#102b50}.welcome p{font-size:14px;color:#64748b}

/* DRIVEPRO V26 – Interactions & motion */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
.content{animation:pageIn .38s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.logo{transition:transform .25s ease,box-shadow .25s ease}
.logo:hover{transform:rotate(-4deg) scale(1.06);box-shadow:0 12px 28px rgba(47,128,237,.35)}
.brandText strong{transition:letter-spacing .2s ease}
.brand:hover .brandText strong{letter-spacing:.2px}

.nav button{position:relative;overflow:hidden;transition:transform .18s ease,background .2s ease,color .2s ease,box-shadow .2s ease}
.nav button:hover{transform:translateX(3px)}
.nav button.active{transform:translateX(2px);box-shadow:0 6px 16px rgba(47,128,237,.08)}
.nav button:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(47,128,237,.16);transform:translate(-50%,-50%) scale(0);transition:transform .45s ease}
.nav button:active:after{transform:translate(-50%,-50%) scale(18);opacity:0}

.primary,.secondary{transition:transform .18s ease,box-shadow .2s ease,filter .2s ease}
.primary:hover{transform:translateY(-2px)!important;box-shadow:0 11px 25px rgba(47,128,237,.30)!important}
.secondary:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(47,128,237,.10)}

.heroCard{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
.heroCard:hover{transform:translateY(-6px) scale(1.012)!important;box-shadow:0 22px 45px rgba(28,83,145,.18)!important}
.heroIcon{transition:transform .3s ease}
.heroCard:hover .heroIcon{transform:scale(1.12) rotate(-5deg)}
.heroValue{transition:transform .25s ease}
.heroCard:hover .heroValue{transform:scale(1.04)}

.livelyCard{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.livelyCard:hover{transform:translateY(-3px);box-shadow:0 20px 42px rgba(28,72,125,.13)!important;border-color:#c9dcef!important}

.dashStudent{transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
.dashStudent:hover{transform:translateX(4px)}
.avatar{transition:transform .25s ease,box-shadow .25s ease}
.dashStudent:hover .avatar{transform:scale(1.08);box-shadow:0 7px 16px rgba(47,128,237,.16)}

.progress i{transform-origin:left center;animation:progressIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes progressIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.upcoming{transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.upcoming:hover{transform:translateX(4px);box-shadow:0 7px 18px rgba(47,128,237,.07)}
.timeBadge{transition:transform .2s ease,background .2s ease}
.upcoming:hover .timeBadge{transform:scale(1.05);background:#dcecff}

.quickAction{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease!important}
.quickAction:hover{transform:translateX(5px)!important;box-shadow:0 9px 20px rgba(47,128,237,.10)}
.quickAction span{transition:transform .25s ease}
.quickAction:hover span{transform:scale(1.1) rotate(-4deg)}

.lesson{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.lesson:hover{transform:translateY(-3px)!important;box-shadow:0 10px 22px rgba(47,128,237,.10)!important}

.event{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.event:hover{transform:scale(1.02);box-shadow:0 5px 14px rgba(47,128,237,.12)}

.modal{animation:none}
.modal.open .dialog{animation:dialogIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes dialogIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.primary{position:relative;overflow:hidden}
.primary:before{content:"";position:absolute;top:-80%;left:-35%;width:35%;height:260%;background:rgba(255,255,255,.22);transform:rotate(18deg);transition:left .55s ease;pointer-events:none}
.primary:hover:before{left:115%}

<script>
const KEY='fahrschul_tracker_windows_v5';
const SETTINGS_KEY='drivepro_settings_v1';
const DEFAULT_SETTINGS={
 theme:'light',
 schoolName:'DrivePro Fahrschulverwaltung',
 schoolAddress:'',
 schoolPhone:'',
 schoolEmail:'',
 durations:{
  'Übungsfahrt':80,
  'B197 Fahrstunde':90,
  'Überlandfahrt':225,
  'Autobahnfahrt':180,
  'Beleuchtungsfahrt':135,
  'Prüfungsfahrt':45
 }
};
let appSettings={...DEFAULT_SETTINGS,durations:{...DEFAULT_SETTINGS.durations}};
try{
 const savedSettings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');
 if(savedSettings){
  appSettings={...DEFAULT_SETTINGS,...savedSettings,durations:{...DEFAULT_SETTINGS.durations,...(savedSettings.durations||{})}};
 }
}catch(e){}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(appSettings))}
function applyTheme(){
 document.documentElement.setAttribute('data-theme',appSettings.theme==='dark'?'dark':'light');
}
applyTheme();
const DEFAULT_AREAS=["Fahrzeugbedienung","Anfahren / Anhalten","Blickführung","Verkehrsbeobachtung","Geschwindigkeit","Abbiegen","Spurwechsel","Fahrstreifenwahl","Abstände","Verkehrszeichen / Ampeln","Kreuzungen","Kreisverkehr","Rückwärtsfahren","Einparken","Grundfahraufgaben","Landstraße","Autobahn","Nachtfahrt","Prüfungsreife"];
const state={page:'dashboard',studentId:null,month:new Date(),calendarView:'week',calendarWeekDate:null,calendarScrollLeft:0};
let students=[];
try{students=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){students=[]}
function getActivityLog(){try{return JSON.parse(localStorage.getItem('drivepro_activity_log')||'[]')}catch(e){return[]}}
function logActivity(action,student,lesson,details=''){
 const log=getActivityLog();
 log.unshift({id:id(),time:new Date().toISOString(),action,studentId:student?.id||'',studentName:student?`${student.firstName} ${student.lastName}`:'',lessonId:lesson?.id||'',details});
 localStorage.setItem('drivepro_activity_log',JSON.stringify(log.slice(0,500)));
}
function activityLabel(x){
 const map={added:'Fahrstunde hinzugefügt',edited:'Fahrstunde geändert',deleted:'Fahrstunde gelöscht',moved:'Fahrstunde verschoben',student_added:'Fahrschüler hinzugefügt',student_edited:'Fahrschüler geändert',student_deleted:'Fahrschüler gelöscht'};
 return map[x]||x;
}
function activityIcon(x){return ({added:'➕',edited:'✏️',deleted:'🗑️',moved:'↔️',student_added:'👤',student_edited:'📝',student_deleted:'👤'})[x]||'•'}
function clearActivityLog(){if(!confirm('Das gesamte Logbuch wirklich löschen?'))return;localStorage.removeItem('drivepro_activity_log');render()}
function save(){localStorage.setItem(KEY,JSON.stringify(students))}
function notifyLessonChange(action,student,lesson){
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const title=action==='added'?'Fahrstunde hinzugefügt':action==='edited'?'Fahrstunde geändert':'Fahrstunde gelöscht';
 const text=`${student.firstName} ${student.lastName} · ${fmtDate(lesson.date)} · ${lesson.startTime||'—'} – ${endTime(lesson.startTime,lesson.duration)} · ${lesson.special||'Übungsfahrt'}`;
 try{navigator.serviceWorker?.ready.then(reg=>reg.showNotification(title,{body:text,icon:'./icon-192.png',badge:'./icon-192.png',tag:'drivepro-lesson-change'})).catch(()=>new Notification(title,{body:text,icon:'./icon-192.png'}))}catch(e){}
}
async function enableNotifications(){
 if(!('Notification' in window)){alert('Dieser Browser unterstützt keine Benachrichtigungen.');return}
 const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
 updateNotificationButton();
 if(permission==='granted')alert('Benachrichtigungen sind jetzt aktiviert.');
}
function updateNotificationButton(){
 const b=document.getElementById('notificationButton');if(!b)return;
 b.textContent=Notification.permission==='granted'?'✓ Benachrichtigungen aktiviert':'🔔 Benachrichtigungen aktivieren';
 b.disabled=Notification.permission==='granted';
}
function id(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function getStudent(id){return students.find(s=>s.id===id)}
function pct(s){return s.areas?.length?Math.round(s.areas.filter(a=>a.level==='Sicher').length/s.areas.length*100):0}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE')}
function fmtTime(t){return t||'—'}
function page(p){state.page=p;state.studentId=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+p).classList.add('active');document.getElementById('pageTitle').textContent={dashboard:'Dashboard',students:'Fahrschüler',calendar:'Kalender',stats:'Statistik',logbook:'Logbuch',settings:'Einstellungen'}[p];render()}
function render(){if(state.page==='dashboard')dashboard();else if(state.page==='students')studentsPage();else if(state.page==='calendar')calendarPage();else if(state.page==='stats')statsPage();else if(state.page==='logbook')logbookPage();else if(state.page==='settings')settingsPage();else dashboard()}
function dashboard(){
 const all=allLessons();
 const total=students.reduce((n,s)=>n+(s.lessons?.length||0),0);
  const today=new Date().toISOString().slice(0,10);
 const upcoming=all.filter(x=>x.l.date>today).sort((a,b)=>(a.l.date+' '+a.l.startTime).localeCompare(b.l.date+' '+b.l.startTime)).slice(0,4);
 const recent=all.slice(0,4);
 document.getElementById('content').innerHTML=`
 <div class="welcome"><div><div class="eyebrow">DEIN FAHRSCHUL-DASHBOARD</div><h2>Guten Tag 👋</h2><p>Hier hast du deine Fahrschüler und den heutigen Ausbildungsstand im Blick.</p></div><button class="primary bigbtn" onclick="openStudentForm()">＋ Fahrschüler hinzufügen</button></div>
 <div class="dashboardGrid">
   <div class="card livelyCard"><div class="section-title"><div><h3>Meine Fahrschüler</h3><span class="muted">Jeder Schüler hat seinen eigenen Ausbildungsfortschritt</span></div><button class="secondary" onclick="page('students')">Alle anzeigen</button></div>
   ${students.slice(0,6).map(s=>dashboardStudent(s)).join('')||'<div class="empty">Noch keine Fahrschüler angelegt.</div>'}</div>
   <div class="card livelyCard nextCard"><div class="section-title"><div><h3>Nächste Termine</h3><span class="muted">Deine nächsten Fahrstunden</span></div><span class="calendarDot">●</span></div>
   ${upcoming.map(x=>upcomingLesson(x.s,x.l)).join('')||'<div class="empty">Keine weiteren Fahrstunden geplant.</div>'}</div>
 </div>
 <div class="dashboardGrid bottomGrid">
   <div class="card livelyCard"><div class="section-title"><div><h3>Letzte Fahrstunden</h3><span class="muted">Zuletzt dokumentiert</span></div></div>
   ${recent.map(x=>lessonRow(x.s,x.l,true)).join('')||'<div class="empty">Noch keine Fahrstunden.</div>'}</div>
   <div class="card livelyCard quickCard"><div class="section-title"><div><h3>Schnellzugriff</h3><span class="muted">Direkt zur richtigen Stelle</span></div></div>
    <button class="quickAction" onclick="page('students')"><span>👥</span><b>Fahrschüler verwalten</b><small>Schüler anlegen & bearbeiten</small><strong>›</strong></button>
    <button class="quickAction" onclick="page('calendar')"><span>📅</span><b>Kalender öffnen</b><small>Termine und Fahrstunden</small><strong>›</strong></button>
    <button class="quickAction" onclick="page('stats')"><span>📊</span><b>Statistik ansehen</b><small>Ausbildungsfortschritt</small><strong>›</strong></button>
   </div>
 </div>`;
}
function dashboardStudent(s){
 const p=pct(s);
 return `<div class="dashStudent" onclick="openStudent('${s.id}')"><div class="avatar bigavatar">${esc((s.firstName[0]||'')+(s.lastName[0]||''))}</div><div class="grow"><div class="studentHead"><b>${esc(s.firstName+' '+s.lastName)}</b><span>${p}% Fortschritt</span></div><div class="studentMeta"><span>Klasse ${esc(s.license)}</span><span>${s.lessons.length} Fahrstunden</span><span>${s.visionAid?'👓 Sehhilfe':'👁 Keine Sehhilfe'}</span><span>${s.theoryPassed?'✓ Theorie bestanden':'○ Theorie offen'}</span></div><div class="progress bigprogress"><i style="width:${p}%"></i></div></div><div class="arrow">›</div></div>`;
}
function upcomingLesson(s,l){
 return `<div class="upcoming" onclick="openLessonDetail('${s.id}','${l.id}')"><div class="timeBadge">${esc(l.startTime||'--:--')}</div><div class="grow"><b>${esc(s.firstName+' '+s.lastName)}</b><div class="muted">${l.duration} Min. · ${esc(l.special||'Übungsfahrt')}</div></div><span class="arrow">›</span></div>`;
}
function studentRow(s){return `<div class="student" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="avatar">${esc((s.firstName[0]||'')+(s.lastName[0]||''))}</div><div class="grow"><b>${esc(s.firstName+' '+s.lastName)}</b><div class="studentMeta"><span>Klasse ${esc(s.license)}</span><span>${(s.lessons||[]).length} Fahrstunden</span><span>${s.visionAid?'👓 Sehhilfe':'👁 Keine Sehhilfe'}</span><span>${s.theoryPassed?'✓ Theorie bestanden':'○ Theorie offen'}</span></div><div class="progress"><i style="width:${pct(s)}%"></i></div></div><div class="studentActions"><button class="secondary" onclick="openStudent('${s.id}')">Öffnen</button><button class="primary smallBtn" onclick="openStudentForm('${s.id}')">Bearbeiten</button><button class="danger smallBtn" onclick="deleteStudent('${s.id}',event)">Löschen</button></div></div>`}
function studentsPage(){
document.getElementById('content').innerHTML=`<div class="toolbar"><div class="muted">Alle Fahrschüler verwalten</div><input id="studentSearch" placeholder="Suchen…" oninput="filterStudents()"></div><div id="studentList" class="students">${students.map(studentRow).join('')||'<div class="card empty" style="grid-column:1/-1">Noch keine Fahrschüler.</div>'}</div>`;
}
function filterStudents(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase();let list=students.filter(s=>(s.firstName+' '+s.lastName+' '+s.license).toLowerCase().includes(q));document.getElementById('studentList').innerHTML=list.map(studentRow).join('')||'<div class="card empty" style="grid-column:1/-1">Keine Treffer.</div>'}
function openStudentForm(studentId=''){let s=studentId?getStudent(studentId):null;openModal(`<h2>${s?'Fahrschüler bearbeiten':'Neuer Fahrschüler'}</h2><div class="row"><div class="field"><label>Vorname</label><input id="sf" value="${esc(s?.firstName||'')}"></div><div class="field"><label>Nachname</label><input id="sl" value="${esc(s?.lastName||'')}"></div></div><div class="row"><div class="field"><label>Klasse</label><select id="sc">${['B','B78','B197'].map(x=>`<option ${x===(s?.license||'B')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ausbildungsbeginn</label><input id="sd" type="date" value="${s?.start||new Date().toISOString().slice(0,10)}"></div></div><div class="row"><div class="field"><label>Geburtsdatum</label><input id="sb" type="date" value="${s?.birthDate||''}"></div><div class="field"><label>Telefon</label><input id="sphone" type="tel" value="${esc(s?.phone||'')}" placeholder="z. B. 0176 12345678"></div></div><div class="row"><div class="field"><label>E-Mail</label><input id="semail" type="email" value="${esc(s?.email||'')}" placeholder="name@example.de"></div><div class="field"><label>Adresse</label><input id="saddress" value="${esc(s?.address||'')}" placeholder="Straße, Hausnummer, PLZ Ort"></div></div><div class="studentChecks"><label><input type="checkbox" id="sv" ${s?.visionAid===true?'checked':''}> Sehhilfe</label><label><input type="checkbox" id="st" ${s?.theoryPassed===true?'checked':''}> Theorie bestanden</label></div><div class="actions"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveStudent('${studentId}')">Speichern</button></div>`)}
async function deleteStudent(sid,event){
 if(event){event.preventDefault();event.stopPropagation()}
 const s=getStudent(sid);if(!s)return;
 const name=`${s.firstName} ${s.lastName}`;
 const countLessons=(s.lessons||[]).length;
 if(!confirm(`Fahrschüler „${name}“ wirklich löschen?\n\nDabei werden auch ${countLessons} Fahrstunde(n) und der Ausbildungsfortschritt dieses Fahrschülers gelöscht.\n\nDieser Vorgang kann nicht rückgängig gemacht werden.`))return;
 if(!confirm(`Letzte Sicherheitsabfrage:\n\n„${name}“ endgültig löschen?`))return;
 const backup=students.slice();
 try{
  dpCloudBackupLocal();
  /* Mark the ID before touching the cloud. Background/realtime loads must
     never interpret the intentional delete as a missing local record and
     upload it again. */
  dpCloudDeletingStudentIds.add(sid);
  students=students.filter(x=>x.id!==sid);
  save();
  render();
  if(dpCloudReady)await dpCloudDeleteStudent(sid,name);
  dpCloudDeletingStudentIds.delete(sid);
  logActivity('student_deleted',s,null,`Fahrschüler gelöscht: ${name}`);
  closeModal();
  render();
  dpCloudStatus('ok',`Fahrschüler „${name}“ dauerhaft gelöscht.`);
 }catch(e){
  dpCloudDeletingStudentIds.delete(sid);
  students=backup;
  save();
  render();
  console.error('DrivePro: Fahrschüler konnte nicht gelöscht werden',sid,e);
  dpCloudStatus('error',e?.message||'Fahrschüler konnte nicht aus der Cloud gelöscht werden.');
  alert(`Der Fahrschüler konnte nicht vollständig gelöscht werden.\n\n${e?.message||'Unbekannter Cloud-Fehler'}\n\nDer Fahrschüler wurde lokal wiederhergestellt.`);
 }
}
function saveStudent(sid){const f=document.getElementById('sf').value.trim(),l=document.getElementById('sl').value.trim();if(!f||!l){alert('Bitte Vor- und Nachnamen eingeben.');return}const personal={firstName:f,lastName:l,license:document.getElementById('sc').value,start:document.getElementById('sd').value,birthDate:document.getElementById('sb').value,phone:document.getElementById('sphone').value.trim(),email:document.getElementById('semail').value.trim(),address:document.getElementById('saddress').value.trim(),visionAid:document.getElementById('sv').checked,theoryPassed:document.getElementById('st').checked};
if(sid){const s=getStudent(sid);Object.assign(s,personal);dpCloudMarkPending(sid);dpCloudMarkProgressPending(sid);for(const l of (s.lessons||[]))dpCloudMarkLessonPending(l.id,l);dpCloudBackupLocal();save();closeModal();render();if(dpCloudReady)dpCloudUpsertStudent(s).catch(e=>{console.error(e);dpCloudStatus('error',e.message||'Speichern fehlgeschlagen')})}else{const s={id:id(),...personal,areas:DEFAULT_AREAS.map(name=>({name,level:'Offen',note:''})),lessons:[],signature:null};students.push(s);dpCloudMarkPending(s.id);dpCloudBackupLocal();save();closeModal();render();if(dpCloudReady)dpCloudUpsertStudent(s).catch(e=>{console.error(e);dpCloudStatus('error',e.message||'Speichern fehlgeschlagen')})}
}
function openStudent(sid){const s=getStudent(sid);state.studentId=sid;openModal(`<div class="profileHeader"><div><h2>${esc(s.firstName+' '+s.lastName)}</h2></div><div class="profileActions"><button class="studentCompleteBtn" onclick="licenseReceivedReport('${sid}')">✓ Führerschein erhalten</button><button class="secondary" onclick="closeModal();openStudentForm('${sid}')">✎ Bearbeiten</button><button class="danger" onclick="deleteStudent('${sid}',event)">🗑 Löschen</button></div></div><div class="tabs"><button class="sel" onclick="studentTab('overview','${sid}',this)">Übersicht</button><button onclick="studentTab('diagram','${sid}',this)">Ausbildungsdiagramm</button><button onclick="studentTab('lessons','${sid}',this)">Fahrstunden</button><button onclick="studentTab('signature','${sid}',this)">Unterschrift</button></div><div id="studentBody">${studentOverview(s)}</div>`)}
function studentTab(tab,sid,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');const s=getStudent(sid),body=document.getElementById('studentBody');if(tab==='overview')body.innerHTML=studentOverview(s);if(tab==='diagram')body.innerHTML=diagram(s);if(tab==='lessons')body.innerHTML=studentLessons(s);if(tab==='signature')body.innerHTML=signature(s)}
function studentOverview(s){
 const specialTypes=[
  {key:'Überlandfahrt',label:'Überlandfahrt',minutes:225,icon:'🌄'},
  {key:'Autobahnfahrt',label:'Autobahnfahrt',minutes:180,icon:'🛣️'},
  {key:'Beleuchtungsfahrt',label:'Beleuchtungsfahrt',minutes:135,icon:'🌙'}
 ];
 const sp=s.lessons.filter(l=>specialTypes.some(x=>x.key===l.special));
 return `<div class="cards">
   <div class="card"><div class="muted">Persönlicher Ausbildungsstand</div><div class="stat">${pct(s)}%</div><div class="progress"><i style="width:${pct(s)}%"></i></div><div class="small" style="margin-top:8px;color:var(--primary)">Fortschritt von ${esc(s.firstName+' '+s.lastName)}</div></div>
   <div class="card"><div class="muted">Fahrstunden</div><div class="stat">${s.lessons.length}</div><div class="small" style="margin-top:8px">dokumentierte Fahrstunden</div></div>
   <div class="card"><div class="muted">Sonderfahrten</div><div class="stat">${specialTypes.filter(x=>sp.some(l=>l.special===x.key)).length}/3</div><div class="small" style="margin-top:8px">abgeschlossen</div></div>
 </div>
 <div class="section-title" style="margin-top:24px"><div><h3>Fehlende Aufgaben</h3><span class="muted">Noch nicht als „Sicher“ dokumentierte Lerninhalte</span></div></div>
 <div class="card missingTasksCard" style="padding:18px;margin-bottom:20px">
   ${s.areas.filter(a=>a.level!=='Sicher').map(a=>`<span class="tag taskTag">${a.level==='Übung'?'🟠':'⚪'} ${esc(a.name)}</span>`).join('')||'<span class="doneMessage">✓ Alle Ausbildungsinhalte sind als sicher dokumentiert.</span>'}
 </div>
 <div class="section-title"><div><h3>Sonderfahrten</h3><span class="muted">Jeweils eine zusammenhängende Sonderfahrt</span></div></div>
 <div class="specialGrid">
 ${specialTypes.map(x=>{const done=sp.some(l=>l.special===x.key);return `<div class="specialCard"><div class="specialIcon">${x.icon}</div><div class="grow"><b>${x.label}</b><div class="muted">${done?'✓ Erfasst':'Noch offen'} · ${x.minutes} Minuten gesamt</div><div class="progress"><i style="width:${done?100:0}%"></i></div></div><strong>${done?'1/1':'0/1'}</strong></div>`}).join('')}
 </div>
 <div class="studentFacts"><span><b>Klasse</b> ${esc(s.license)}</span><span><b>Ausbildungsbeginn</b> ${fmtDate(s.start)}</span><span><b>Geburtsdatum</b> ${s.birthDate?fmtDate(s.birthDate):'—'}</span><span><b>Telefon</b> ${esc(s.phone||'—')}</span><span><b>E-Mail</b> ${esc(s.email||'—')}</span><span><b>Adresse</b> ${esc(s.address||'—')}</span><span><b>Sehhilfe</b> ${s.visionAid?'Ja':'Nein'}</span><span><b>Theorie</b> ${s.theoryPassed?'Bestanden':'Noch nicht bestanden'}</span></div>`;
}
function diagram(s){return `<div class="diagramHead"><div><h3>Ausbildungsdiagramm</h3><p class="muted">Klicke auf einen Kreis, um den aktuellen Ausbildungsstand zu setzen.</p></div><div class="diagramLegend"><span><i class="legendDot open"></i>Offen</span><span><i class="legendDot practice"></i>Üben</span><span><i class="legendDot safe"></i>Sicher</span></div></div>${s.areas.map((a,i)=>`<div class="area"><b>${esc(a.name)}</b><div class="statusDots" role="group" aria-label="Ausbildungsstand">
 <button type="button" class="statusDot statusOpen ${a.level==='Offen'?'selected':''}" title="Offen" aria-label="Offen" onclick="setArea('${s.id}',${i},'Offen')"></button>
 <button type="button" class="statusDot statusPractice ${a.level==='Übung'?'selected':''}" title="Üben" aria-label="Üben" onclick="setArea('${s.id}',${i},'Übung')"></button>

function lessonStartMinutes(t){
 const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);
 return m?Number(m[1])*60+Number(m[2]):null;
}
function lessonEndMinutes(l){
 const start=lessonStartMinutes(l.startTime);

}
function findLessonConflict(data,ignoreId){
 const start=lessonStartMinutes(data.startTime);
 const end=start===null?null:start+Number(data.duration||0);
 if(start===null||end===null||end<=start)return null;
 for(const st of students){
   for(const l of (st.lessons||[])){
     if(l.id===ignoreId || l.date!==data.date)continue;
     const os=lessonStartMinutes(l.startTime), oe=lessonEndMinutes(l);
     if(os===null||oe===null)continue;
     if(start<oe && end>os)return {student:st,lesson:l};
   }
 }
 return null;
}
function saveLesson(oldStudentId,lessonId){

 const conflict=findLessonConflict(data,lessonId);
 if(conflict){
   const start=conflict.lesson.startTime||'--:--';
   const end=conflict.lesson.duration?endTime(start,conflict.lesson.duration):'--:--';
   const name=conflict.student.firstName+' '+conflict.student.lastName;
   showConflictOverlay({
 newTime:`${esc(data.startTime)} – ${esc(endTime(data.startTime,data.duration))}`,

 });
   return;
 
 }
 let changedLesson,notificationAction;
 if(lessonId){
   let old=getStudent(oldStudentId).lessons.find(x=>x.id===lessonId);
   Object.assign(old,data);
   if(oldStudentId!==sid){
     getStudent(oldStudentId).lessons=getStudent(oldStudentId).lessons.filter(x=>x.id!==lessonId);

   }

 dpCloudMarkLessonPending(changedLesson.id,changedLesson);save();closeModal();render();
 const actionText=notificationAction==='added'?'Neue Fahrstunde angelegt':`Fahrstunde geändert: ${changedLesson.startTime||'—'} – ${endTime(changedLesson.startTime,changedLesson.duration)} · ${changedLesson.special||'Übungsfahrt'}`;
 logActivity(notificationAction,s,changedLesson,actionText);
 notifyLessonChange(notificationAction,s,changedLesson);
 if(dpCloudReady)dpCloudUpsertLesson(s,changedLesson).catch(e=>{console.error(e);dpCloudStatus('error',e.message||'Fahrstunde konnte nicht synchronisiert werden')});
}

function initTimelineDrag(){

 events.forEach(el=>{

   const getTarget=(e,d)=>{
     const grid=document.querySelector('.dpTimelineGrid');
     if(!grid)return null;
     const gridRect=grid.getBoundingClientRect(), colWidth=gridRect.width/7;
     let col=Math.floor((e.clientX-gridRect.left)/colWidth);
     col=Math.max(0,Math.min(6,col));
     const targetDay=new Date(state.calendarWeekDate||new Date());
     targetDay.setHours(12,0,0,0);
     targetDay.setDate(targetDay.getDate()-((targetDay.getDay()+6)%7)+col);
     const date=targetDay.getFullYear()+'-'+String(targetDay.getMonth()+1).padStart(2,'0')+'-'+String(targetDay.getDate()).padStart(2,'0');
     const body=grid.querySelectorAll('.dpWeekDay')[col]?.querySelector('.dpTimelineBody');
     if(!body)return null;
     const bodyRect=body.getBoundingClientRect(), hourHeight=58, timelineStart=6;
     let minutes=Math.round((e.clientY-bodyRect.top)/(hourHeight/60)/5)*5 + timelineStart*60;

     return {date,startTime:`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`,col,minutes};
   };
   el.addEventListener('pointerdown',e=>{
     if(e.button!==undefined&&e.button!==0)return;
     drag={x:e.clientX,y:e.clientY,started:false,sid:el.dataset.sid,lid:el.dataset.lid,duration:Number(el.dataset.duration)||60};
     el.setPointerCapture?.(e.pointerId);e.preventDefault();
   });
   el.addEventListener('pointermove',e=>{
     if(!drag)return;
     const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
     if(!drag.started&&Math.hypot(dx,dy)<5)return;
     drag.started=true;el.classList.add('dragging');
     el.style.transform=`translate(${dx}px,${dy}px)`;
     const target=getTarget(e,drag);
     if(target) showDragPreview(target,drag.duration,e.clientX,e.clientY);
   });
   el.addEventListener('pointerup',e=>{
     if(!drag)return;

       return;
     }
     const previousDate=lesson.date,previousTime=lesson.startTime;lesson.date=data.date;lesson.startTime=data.startTime;dpCloudMarkLessonPending(lesson.id,lesson);dpCloudBackupLocal();save();state.calendarWeekDate=data.date;render();logActivity('moved',getStudent(d.sid),lesson,`Verschoben von ${fmtDate(previousDate)} ${previousTime||'—'} nach ${fmtDate(lesson.date)} ${lesson.startTime||'—'}`);notifyLessonChange('edited',getStudent(d.sid),lesson);if(dpCloudReady)dpCloudUpsertLesson(getStudent(d.sid),lesson).catch(e=>{console.error(e);dpCloudStatus('error',e.message||'Verschieben konnte nicht synchronisiert werden')});
   });
   el.addEventListener('pointercancel',()=>{if(drag){drag=null;el.classList.remove('dragging');el.style.transform=''}document.querySelector('.dpDragPreview')?.remove()});
 });

/* V90.13 – Stable Cloud Sync + Delete Race Fix
   - No Supabase Realtime/WebSocket is used. Polling is the reliable fallback.
   - All cloud writes are serialized to prevent concurrent 409 conflicts.
   - training_progress is written with update-first / insert-fallback logic.
   - Deletions create a cloud tombstone in activity_log before the student row is removed.
   - A tombstoned student can never be resurrected by another device's local cache.
*/
const DP_CLOUD_OWNER_KEY='drivepro_cloud_owner_v913';
const DP_CLOUD_BACKUP_KEY='drivepro_local_backup_v913';
const DP_CLOUD_TOMBSTONE_ACTION='deleted';
/* Event-driven cloud sync:
   The cloud is written immediately after a local change. We deliberately do
   NOT poll/reload the complete database in the background, because doing so
   can overwrite a just-created lesson and reset the calendar scroll position. */
let dpCloudReady=false;
let dpCloudBusy=false;
let dpCloudLoadQueued=false;
let dpCloudInitialLoadDone=false;
let dpCloudRealtimeChannel=null;
let dpCloudRealtimeStarting=false;
let dpCloudRealtimeRetryTimer=null;
let dpCloudRealtimeRetryCount=0;
let dpCloudKnownStudentIds=new Set();
let dpCloudPendingLessonIds=new Set();
let dpCloudPendingLessonSnapshots=new Map();
let dpCloudPendingProgressStudentIds=new Set();
let dpCloudDeletingStudentIds=new Set();
let dpCloudPendingStudentIds=new Set();
let dpCloudWriteQueue=Promise.resolve();

function dpCloudClient(){return window.driveProAuth?.client||null}
function dpCloudUserId(){return window.driveProAuth?.user?.id||null}
function dpCloudQueue(task){
 const run=dpCloudWriteQueue.then(()=>task());
 dpCloudWriteQueue=run.catch(()=>{});
 return run;
}
function dpCloudMarkPending(sid){if(sid)dpCloudPendingStudentIds.add(sid)}
function dpCloudClearPending(sid){if(sid)dpCloudPendingStudentIds.delete(sid)}
function dpCloudMarkLessonPending(lid,lesson){
 if(!lid)return;
 dpCloudPendingLessonIds.add(lid);
 if(lesson)dpCloudPendingLessonSnapshots.set(lid,JSON.parse(JSON.stringify(lesson)));
 else{
  for(const s of (students||[])){const l=(s.lessons||[]).find(x=>x.id===lid);if(l){dpCloudPendingLessonSnapshots.set(lid,JSON.parse(JSON.stringify(l)));break}}
 }
}
function dpCloudClearLessonPending(lid){if(lid){dpCloudPendingLessonIds.delete(lid);dpCloudPendingLessonSnapshots.delete(lid)}}
function dpCloudLessonMatchesSnapshot(row,snap){
 if(!row||!snap)return false;
 const clean=v=>v==null?'':String(v);
 return clean(row.lesson_date)===clean(snap.date) && clean(row.start_time).slice(0,5)===clean(snap.startTime).slice(0,5) && Number(row.duration_minutes||0)===Number(snap.duration||0) && clean(row.special_type)===clean(snap.special) && clean(row.notes)===clean(snap.note||snap.notes);
}
function dpCloudMarkProgressPending(sid){if(sid)dpCloudPendingProgressStudentIds.add(sid)}
function dpCloudClearProgressPending(sid){if(sid)dpCloudPendingProgressStudentIds.delete(sid)}

window.driveProCloudDiagnostics=async function(){
 const c=dpCloudClient(),u=dpCloudUserId();
 if(!c||!u)return {ok:false,error:'Nicht eingeloggt'};

 for(const t of ['students','training_progress','lessons','activity_log']){

function dpCloudStudentRow(s,uid){
 return {id:s.id,user_id:uid,first_name:s.firstName||'',last_name:s.lastName||'',birth_date:s.birthDate||null,phone:s.phone||'',email:s.email||'',address:s.address||'',license_class:s.license||'B',training_start:s.start||null,vision_aid:s.visionAid===true,theory_passed:s.theoryPassed===true,practice_exam_date:s.practiceExamDate||null,license_received_date:s.licenseReceivedDate||null,notes:s.notes||''};
}
function dpCloudLessonRow(s,l,uid){
 return {id:l.id,user_id:uid,student_id:s.id,lesson_date:l.date,start_time:l.startTime,end_time:endTime(l.startTime,Number(l.duration)||0),lesson_type:l.lessonType||'Fahrstunde',special_type:l.special||null,duration_minutes:Number(l.duration)||0,kilometers:l.kilometers===''||l.kilometers==null?null:Number(l.kilometers),notes:l.note||l.notes||'',color:l.color||null,signature:l.signature||null};
}
async function dpCloudProgressWrite(payload){
 const client=dpCloudClient();
 if(!client)throw new Error('Cloud-Verbindung nicht verfügbar.');
 /* First update the exact row. This avoids relying on PostgREST's conflict-target
    inference and is safe when the unique constraint already exists. */
 let r=await client.from('training_progress').update({level:payload.level,note:payload.note}).eq('user_id',payload.user_id).eq('student_id',payload.student_id).eq('area_name',payload.area_name).select('id').maybeSingle();
 if(r.error)throw r.error;
 if((r.data||[]).length>0)return;
 /* No row existed: insert it. If another request wins the race, update it once more. */
 r=await client.from('training_progress').insert(payload).select('id').maybeSingle();
 if(!r.error)return;
 if(r.error.code==='23505'||r.status===409){
  const retry=await client.from('training_progress').update({level:payload.level,note:payload.note,user_id:payload.user_id}).eq('user_id',payload.user_id).eq('student_id',payload.student_id).eq('area_name',payload.area_name);
  if(!retry.error)return;
 }
 throw r.error;
}
async function dpCloudSyncProgress(s,alreadyQueued=false){
 const client=dpCloudClient(),uid=dpCloudUserId();
 if(!client||!uid||!s)return;
 const work=async()=>{
  const q=await client.from('training_progress').select('id,area_name').eq('user_id',uid).eq('student_id',s.id);
  if(q.error)throw q.error;
  const existing=q.data||[];const wanted=new Set();
  for(const a of (s.areas||[])){
   const areaName=(a.name||'').trim();if(!areaName)continue;
   wanted.add(areaName);
   await dpCloudProgressWrite({user_id:uid,student_id:s.id,area_name:areaName,level:a.level||'Offen',note:a.note||''});
  }
  for(const old of existing){
   if(!wanted.has(old.area_name)){
    const r=await client.from('training_progress').delete().eq('id',old.id).eq('user_id',uid);
    if(r.error)throw r.error;
   }
  }
 };
 const result=alreadyQueued?await work():await dpCloudQueue(work);
 dpCloudClearProgressPending(s.id);
 return result;
}
async function dpCloudUpsertStudent(s){
 const client=dpCloudClient(),uid=dpCloudUserId();
 if(!client||!uid||!s)return;
 dpCloudMarkPending(s.id);dpCloudStatus('syncing','Fahrschüler wird gespeichert …');
 try{
  await dpCloudQueue(async()=>{
   const r=await client.from('students').upsert(dpCloudStudentRow(s,uid),{onConflict:'id'});
   if(r.error)throw r.error;
   await dpCloudSyncProgress(s,true);
   for(const l of (s.lessons||[]))await dpCloudUpsertLesson(s,l,true,true);
  });
  dpCloudReady=true;dpCloudClearPending(s.id);dpCloudStatus('ok','Fahrschüler und Ausbildungsstand sind in der Cloud gespeichert.');
 }catch(e){dpCloudStatus('error',e?.message||'Fahrschüler konnte nicht synchronisiert werden.');throw e}
}
async function dpCloudUpsertLesson(s,l,silent=false,alreadyQueued=false){
 const client=dpCloudClient(),uid=dpCloudUserId();
 if(!client||!uid||!s||!l)return;
 const work=async()=>{
  const payload=dpCloudLessonRow(s,l,uid);
  const r=await client.from('lessons').upsert(payload,{onConflict:'id'});
  if(r.error)throw r.error;
 };
 if(!silent)dpCloudStatus('syncing','Fahrstunde wird gespeichert …');
 try{await (alreadyQueued?work():dpCloudQueue(work));if(!silent)dpCloudStatus('ok','Fahrstunde in der Cloud gespeichert.');/* Keep the pending snapshot until a later cloud read confirms it. This prevents a fast polling cycle from replacing a just-saved lesson with stale data. */}catch(e){if(!silent)dpCloudStatus('error',e?.message||'Fahrstunde konnte nicht synchronisiert werden.');throw e}
}
async function dpCloudDeleteLesson(lid){
 const client=dpCloudClient(),uid=dpCloudUserId();if(!client||!uid||!lid)return;
 dpCloudStatus('syncing','Fahrstunde wird gelöscht …');
 try{await dpCloudQueue(async()=>{const r=await client.from('lessons').delete().eq('id',lid).eq('user_id',uid);if(r.error)throw r.error});dpCloudClearLessonPending(lid);dpCloudStatus('ok','Fahrstunde aus der Cloud gelöscht.')}catch(e){dpCloudStatus('error',e?.message||'Fahrstunde konnte nicht gelöscht werden.');throw e}
}
async function dpCloudCreateDeleteTombstone(sid,name){
 const client=dpCloudClient(),uid=dpCloudUserId();
 /* IMPORTANT: activity_log's CHECK constraint accepts the normal action
    'deleted', not the custom 'student_deleted' value. The student id is
    stored in metadata so other devices can recognize the tombstone. */
 const payload={id:id(),user_id:uid,student_id:null,student_name:name||'',action:'deleted',details:`Fahrschüler gelöscht: ${name||sid}`,metadata:{deleted_student_id:sid,deleted_at:new Date().toISOString(),tombstone_type:'student'}};
 const r=await client.from('activity_log').insert(payload);
 if(r.error)throw r.error;
}
async function dpCloudGetDeletedIds(){
 const client=dpCloudClient(),uid=dpCloudUserId();
 /* activity_log only permits its normal action values (including 'deleted').
    Student tombstones are therefore stored as a normal 'deleted' log entry,
    with the deleted_student_id carried in metadata. We intentionally fetch
    all deleted log entries and only treat rows with deleted_student_id as
    student tombstones, so lesson deletions remain harmless. */
 const r=await client.from('activity_log').select('metadata,action,created_at').eq('user_id',uid).eq('action','deleted').order('created_at',{ascending:false});
 if(r.error)throw r.error;
 const set=new Set();
 for(const row of (r.data||[])){
  const sid=row?.metadata?.deleted_student_id;
  if(sid)set.add(String(sid));
 }
 return set;
}
async function dpCloudDeleteStudent(sid,name){
 const client=dpCloudClient(),uid=dpCloudUserId();if(!client||!uid||!sid)return;
 dpCloudDeletingStudentIds.add(sid);dpCloudStatus('syncing','Fahrschüler wird dauerhaft gelöscht …');
 try{
  await dpCloudQueue(async()=>{
   /* Tombstone first. Other devices will see this marker and will never
      re-upload their stale local copy. */
   await dpCloudCreateDeleteTombstone(sid,name);
   let r=await client.from('training_progress').delete().eq('user_id',uid).eq('student_id',sid);if(r.error)throw r.error;
   r=await client.from('lessons').delete().eq('user_id',uid).eq('student_id',sid);if(r.error)throw r.error;
   r=await client.from('students').delete().eq('user_id',uid).eq('id',sid);if(r.error)throw r.error;
  });
  dpCloudKnownStudentIds.delete(sid);dpCloudClearPending(sid);dpCloudStatus('ok','Fahrschüler dauerhaft aus der Cloud gelöscht.');
 }catch(e){dpCloudStatus('error',e?.message||'Fahrschüler konnte nicht gelöscht werden.');throw e}
 finally{dpCloudDeletingStudentIds.delete(sid)}
}
async function dpCloudDeleteAll(){
 const client=dpCloudClient(),uid=dpCloudUserId();if(!client||!uid)return;
 dpCloudStatus('syncing','Cloud-Daten werden gelöscht …');
 await dpCloudQueue(async()=>{
  const s=await client.from('students').select('id').eq('user_id',uid);if(s.error)throw s.error;
  let r=await client.from('training_progress').delete().eq('user_id',uid);if(r.error)throw r.error;
  r=await client.from('lessons').delete().eq('user_id',uid);if(r.error)throw r.error;
  r=await client.from('students').delete().eq('user_id',uid);if(r.error)throw r.error;
 });
 dpCloudStatus('ok','Cloud-Daten gelöscht.');
}
async function dpCloudMigrateLocal(sourceStudents=students){
 const client=dpCloudClient(),uid=dpCloudUserId();if(!client||!uid)return {migrated:0,failed:[]};
 const deletedIds=await dpCloudGetDeletedIds();
 const candidates=(sourceStudents||[]).filter(s=>!deletedIds.has(String(s.id))&&!dpCloudDeletingStudentIds.has(s.id));
 dpCloudStatus('syncing','Lokale Daten werden einmalig mit der Cloud abgeglichen …');
 const failed=[];let migrated=0;
 for(const s of candidates){
  try{await dpCloudUpsertStudent(s);migrated++}catch(e){console.error('DrivePro: Migration fehlgeschlagen',s?.id,e);failed.push({student:s,error:e})}
 }
 if(failed.length)dpCloudStatus('error',`${migrated} gespeichert, ${failed.length} konnten nicht übertragen werden.`);
 else{localStorage.setItem(DP_CLOUD_OWNER_KEY,uid);dpCloudReady=true;dpCloudStatus('ok',`${migrated} Fahrschüler mit der Cloud abgeglichen.`)}
 return {migrated,failed};
}
async function dpCloudLoad(){
 const client=dpCloudClient(),uid=dpCloudUserId();if(!client||!uid)return;
 if(dpCloudBusy){dpCloudLoadQueued=true;return}
 dpCloudBusy=true;
 try{
  dpCloudStatus('syncing','Cloud-Daten werden geladen …');

  /* The student list is the critical part of the sync. Ancillary tables
     must never prevent students from loading. This is especially important
     on a newly authenticated mobile session. */
  const sr=await client.from('students').select('*').eq('user_id',uid).order('last_name',{ascending:true});
  if(sr.error)throw new Error('students: '+(sr.error.message||'Lesefehler'));

  let deletedIds=new Set();
  try{
   const dr=await dpCloudGetDeletedIds();
   if(dr instanceof Set)deletedIds=dr;
  }catch(e){
   /* A problem in activity_log must not block the main student sync. */
   console.warn('DrivePro: Löschvermerke konnten nicht geladen werden:',e);
  }

  let progressRows=[];
  try{
   const pr=await client.from('training_progress').select('*').eq('user_id',uid);
   if(pr.error)throw pr.error;
   progressRows=pr.data||[];
  }catch(e){
   console.warn('DrivePro: Ausbildungsfortschritt konnte nicht geladen werden:',e);
   dpCloudStatus('syncing','Fahrschüler werden synchronisiert …');
  }

  let lessonRows=[];
  try{
   const lr=await client.from('lessons').select('id,user_id,student_id,lesson_date,start_time,end_time,lesson_type,special_type,duration_minutes,kilometers,notes,color,signature,created_at,updated_at').eq('user_id',uid).order('lesson_date',{ascending:true}).order('start_time',{ascending:true});
   if(lr.error)throw lr.error;
   lessonRows=lr.data||[];
  }catch(e){
   console.warn('DrivePro: Fahrstunden konnten nicht geladen werden:',e);
  }

  /* A successful REST upsert can be followed by a poll before the UI's read
     sees the newest row. Keep the exact local snapshot until the cloud read
     confirms the same values. */
  const lessonRowsById=new Map(lessonRows.map(x=>[x.id,x]));
  for(const lid of [...dpCloudPendingLessonIds]){
   const snap=dpCloudPendingLessonSnapshots.get(lid);
   const row=lessonRowsById.get(lid);
   if(row && dpCloudLessonMatchesSnapshot(row,snap)) dpCloudClearLessonPending(lid);
  }

  let cloudStudents=(sr.data||[]).filter(r=>!deletedIds.has(String(r.id))&&!dpCloudDeletingStudentIds.has(String(r.id)));

  const hasOwner=localStorage.getItem(DP_CLOUD_OWNER_KEY)===uid;
  const cloudIds=new Set(cloudStudents.map(c=>c.id));

  /* Only records explicitly changed/created locally are upload candidates.
     Never resurrect an intentionally deleted record. */
  const candidates=(students||[]).filter(s=>
    !dpCloudDeletingStudentIds.has(s.id) &&
    !deletedIds.has(String(s.id)) &&
    (!hasOwner || !cloudIds.has(s.id)) &&
    (!hasOwner || dpCloudPendingStudentIds.has(s.id))
  );

  if(!hasOwner && students.length){
   dpCloudBackupLocal();
   const result=await dpCloudMigrateLocal(students);
   if(result.failed.length){
    dpCloudStatus('error',`${result.migrated} gespeichert, ${result.failed.length} konnten nicht übertragen werden.`);
   }
   const again=await client.from('students').select('*').eq('user_id',uid).order('last_name',{ascending:true});
   if(again.error)throw new Error('students: '+again.error.message);
   cloudStudents=(again.data||[]).filter(r=>!deletedIds.has(String(r.id))&&!dpCloudDeletingStudentIds.has(String(r.id)));
  }else if(candidates.length){
   for(const s of candidates){
    try{
     await dpCloudUpsertStudent(s);
     dpCloudClearPending(s.id);
    }catch(e){
     console.error('DrivePro: ausstehender Schüler',s.id,e);
    }
   }
   const again=await client.from('students').select('*').eq('user_id',uid).order('last_name',{ascending:true});
   if(again.error)throw new Error('students: '+(again.error?.message||'Lesefehler'));
   cloudStudents=(again.data||[]).filter(r=>!deletedIds.has(String(r.id))&&!dpCloudDeletingStudentIds.has(String(r.id)));
  }

  /* Retry every explicitly pending lesson and training-progress change.
     This is what makes mobile/background/offline edits eventually reach the
     cloud even if the immediate write was interrupted. */
  for(const s of (students||[])){
   if(dpCloudDeletingStudentIds.has(s.id)||deletedIds.has(String(s.id)))continue;
   if(dpCloudPendingProgressStudentIds.has(s.id)){
    try{await dpCloudSyncProgress(s);dpCloudClearProgressPending(s.id)}catch(e){console.warn('DrivePro: Fortschritt wartet noch',s.id,e)}
   }
   for(const l of (s.lessons||[])){
    if(!dpCloudPendingLessonIds.has(l.id))continue;
    try{await dpCloudUpsertLesson(s,l,true);dpCloudClearLessonPending(l.id)}catch(e){console.warn('DrivePro: Fahrstunde wartet noch',l.id,e)}
   }
  }

  const progressByStudent={};
  for(const x of progressRows){
   (progressByStudent[x.student_id]||(progressByStudent[x.student_id]=[])).push(x);
  }
  const lessonsByStudent={};
  for(const x of lessonRows){
   (lessonsByStudent[x.student_id]||(lessonsByStudent[x.student_id]=[])).push(x);
  }

  const cloudMapped=cloudStudents.map(row=>{
   const areas=(progressByStudent[row.id]||[]).map(x=>({name:x.area_name,level:x.level||'Offen',note:x.note||''}));
   const mappedLessons=(lessonsByStudent[row.id]||[]).map(x=>({
    id:x.id,date:x.lesson_date,startTime:(x.start_time||'').slice(0,5),
    duration:Number(x.duration_minutes)||0,special:x.special_type||'',
    lessonType:x.lesson_type||'Fahrstunde',note:x.notes||'',
    kilometers:x.kilometers==null?'':x.kilometers,color:x.color||null,signature:x.signature||null
   }));
   const localStudent=(students||[]).find(s=>s.id===row.id);
   if(localStudent){
    const cloudLessonIds=new Set(mappedLessons.map(x=>x.id));
    /* Pending snapshots win over stale cloud rows until the cloud read has
       positively acknowledged the write. */
    for(const [lid,snap] of dpCloudPendingLessonSnapshots){
     const owner=(students||[]).find(st=>(st.lessons||[]).some(ll=>ll.id===lid));
     if(!owner || owner.id!==row.id)continue;
     if(!cloudLessonIds.has(lid))mappedLessons.push({...snap});
     else{
      const idx=mappedLessons.findIndex(x=>x.id===lid);
      if(idx>=0)mappedLessons[idx]={...snap};
     }
    }
    for(const localLesson of (localStudent.lessons||[])){
     if(dpCloudPendingLessonIds.has(localLesson.id) && !cloudLessonIds.has(localLesson.id) && !mappedLessons.some(x=>x.id===localLesson.id))mappedLessons.push({...localLesson});
    }
   }
   return {
    id:row.id,firstName:row.first_name||'',lastName:row.last_name||'',
    license:row.license_class||'B',start:row.training_start||'',
    birthDate:row.birth_date||'',phone:row.phone||'',email:row.email||'',
    address:row.address||'',visionAid:row.vision_aid===true,theoryPassed:row.theory_passed===true,
    practiceExamDate:row.practice_exam_date||'',licenseReceivedDate:row.license_received_date||'',
    notes:row.notes||'',
    areas:areas.length?areas:DEFAULT_AREAS.map(name=>({name,level:'Offen',note:''})),
    lessons:mappedLessons,signature:null
   };
  });

  dpCloudKnownStudentIds=new Set(cloudMapped.map(s=>s.id));
  const syncedIds=new Set(cloudMapped.map(s=>s.id));

  /* Keep local pending records visible if an individual write is still
     waiting. Never let a tombstoned/deleting record return. */
  const stillLocal=(students||[]).filter(s=>
    !dpCloudDeletingStudentIds.has(s.id) &&
    !deletedIds.has(String(s.id)) &&
    !syncedIds.has(s.id)
  );

  students=cloudMapped.concat(stillLocal);
  save();

  /* If the calendar is currently open, redraw it immediately after the
     cloud response arrives. Without this, the data was synchronized in
     memory but the visible calendar stayed on the old local state until
     a manual reload. */
  if(state.page==='calendar') render();

  localStorage.setItem(DP_CLOUD_OWNER_KEY,uid);
  dpCloudReady=true;

  if(stillLocal.length){
   dpCloudStatus('syncing',`${cloudMapped.length} Cloud-Fahrschüler geladen; ${stillLocal.length} lokale Änderungen werden noch übertragen …`);
  }else{
   dpCloudStatus('ok',`${students.length} Fahrschüler synchronisiert.`);
  }
 }catch(err){
  const msg=err?.message||'Unbekannter Cloud-Lesefehler';
  console.error('DrivePro Cloud-Sync:',msg,err);
  dpCloudStatus('error','Cloud-Fehler: '+msg);
 }finally{
  dpCloudBusy=false;
  if(dpCloudLoadQueued){
   dpCloudLoadQueued=false;
   setTimeout(()=>dpCloudLoad(),100);
  }
 }
}

function dpCloudForceSync(){
 if(!dpCloudReady){dpCloudStatus('error','Cloud ist noch nicht bereit. Bitte kurz warten.');return}
 dpCloudLoad().catch(e=>console.error('DrivePro manueller Sync:',e));
}

function dpCloudRealtimeStop(){
 if(dpCloudRealtimeRetryTimer){clearTimeout(dpCloudRealtimeRetryTimer);dpCloudRealtimeRetryTimer=null}
 const c=dpCloudRealtimeChannel;dpCloudRealtimeChannel=null;dpCloudRealtimeStarting=false;dpCloudRealtimeRetryCount=0;

async function dpCloudRealtimeStart(){
 const c=dpCloudClient(),uid=dpCloudUserId();if(!c||!uid||dpCloudRealtimeStarting||dpCloudRealtimeChannel||!dpCloudReady)return;
 dpCloudRealtimeStarting=true;
 try{
  const sess=await c.auth.getSession(),token=sess.data?.session?.access_token;
  if(token&&c.realtime?.setAuth)await c.realtime.setAuth(token);
  const ch=c.channel('drivepro-data-'+uid);
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'students',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyStudent(p.new.id).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'students',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyStudent(p.new.id).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'DELETE',schema:'public',table:'students'},p=>{const id=p.old?.id;if(id){const i=students.findIndex(s=>s.id===id);if(i>=0){students.splice(i,1);save();if(['calendar','dashboard','students','stats'].includes(state.page))render()}}});
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'lessons',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyLesson(p).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'lessons',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyLesson(p).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'DELETE',schema:'public',table:'lessons'},p=>dpCloudRealtimeApplyLesson(p).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'training_progress',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyProgress(p).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'training_progress',filter:`user_id=eq.${uid}`},p=>dpCloudRealtimeApplyProgress(p).catch(dpCloudRealtimeHandleError));
  ch.on('postgres_changes',{event:'DELETE',schema:'public',table:'training_progress'},p=>dpCloudRealtimeApplyProgress(p).catch(dpCloudRealtimeHandleError));
  dpCloudRealtimeChannel=ch;
  ch.subscribe(status=>{
   if(status==='SUBSCRIBED'){dpCloudRealtimeRetryCount=0;dpCloudStatus('ok','Cloud gespeichert · Live-Sync aktiv')}
   else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){dpCloudRealtimeChannel=null;dpCloudRealtimeHandleError(new Error(status))}
   else if(status==='CLOSED')dpCloudRealtimeChannel=null;
  });
 }catch(e){dpCloudRealtimeChannel=null;dpCloudRealtimeHandleError(e)}
 finally{dpCloudRealtimeStarting=false}
}

}

async function dpCloudRetryPendingWrites(){
 if(!dpCloudReady)return;
 const uid=dpCloudUserId(); if(!uid)return;
 for(const s of (students||[])){
  if(dpCloudDeletingStudentIds.has(s.id))continue;
  if(dpCloudPendingStudentIds.has(s.id)){
   try{await dpCloudUpsertStudent(s);dpCloudClearPending(s.id)}catch(e){console.warn('DrivePro: pending Schüler-Änderung:',e)}
  }
  if(dpCloudPendingProgressStudentIds.has(s.id)){
   try{await dpCloudSyncProgress(s);dpCloudClearProgressPending(s.id)}catch(e){console.warn('DrivePro: pending Ausbildungsstand:',e)}
  }
  for(const l of (s.lessons||[])){
   if(!dpCloudPendingLessonIds.has(l.id))continue;
   try{await dpCloudUpsertLesson(s,l,true);dpCloudClearLessonPending(l.id)}catch(e){console.warn('DrivePro: pending Fahrstunde:',e)}
  }

}

<script>
(function(){
  let sx=0, sy=0, tracking=false;
  function side(){return document.querySelector('.side')}
  window.openMobileMenu=function(){
    const s=side(); if(!s)return;
    s.classList.add('mobile-open');
    document.body.classList.add('mobileMenuOpen');
    const o=document.getElementById('mobileMenuShade'); if(o)o.style.display='';
  };
  window.closeMobileMenu=function(){
    const s=side(); if(!s)return;
    s.classList.remove('mobile-open');
    document.body.classList.remove('mobileMenuOpen');
    const o=document.getElementById('mobileMenuShade'); if(o)o.style.display='';
  };
  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>700)return;
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking||window.innerWidth>700)return;
    tracking=false;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.25){
      if(sx<28 && dx>0) openMobileMenu();
      else if(dx<0) closeMobileMenu();
    }
  },{passive:true});
  document.addEventListener('click',e=>{
    if(window.innerWidth>700 && !document.body.classList.contains('mobileMenuOpen'))return;
    const b=e.target.closest('.nav button');
    if(b) setTimeout(closeMobileMenu,80);
  });
})();
</script>
